
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="A simple Google home page clone built for frontend practice">
    <title>Google (clone)</title>
    <link rel="stylesheet" href="./styles.css">
</head>

<body>

    <button type="button" onclick="window.location.href='./index.html'" aria-label="Home">🏠</button>

    <main class="frame" role="main">
        <div class="frame1">
            <div class="frame2">
                <img src="https://pngimg.com/d/google_PNG19644.png" id="image" alt="Google logo">
            </div>

            <div class="frame3">
                <form action="#" onsubmit="event.preventDefault();">
                    <input type="search" id="input" name="q" placeholder="Search Google or type a URL" aria-label="Search">
                </form>
            </div>

            <div class="frame4">
                <button type="submit" class="button1">Google Search</button>
                <button type="button" class="button2">I'm feeling lucky</button>
            </div>

            <div class="privacy">
                <p>We protect your privacy. <a href="/">Learn how</a></p>
            </div>
        </div>
    </main>

</body>

</html>
